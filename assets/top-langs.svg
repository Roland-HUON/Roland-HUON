<svg width="350" height="192" viewBox="0 0 350 192" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cardTitle">
  <title id="cardTitle">Most Used Languages</title>
  <desc>HTML 45.7%, Jupyter Notebook 25.4%, JavaScript 20.1%, PHP 3.9%, CSS 2.3%, TypeScript 1.3%, Swift 1.0%, Vue 0.2%, Other 0.1%</desc>
  <style><![CDATA[
    .card-title { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #70a5fd; }
    .label { font: 400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #38bdae; }
    .value { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #38bdae; }
    .muted { font: 400 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #8b93b8; }
    .icon { fill: #bf91f3; }
    /* Deliberately no animation anywhere in these cards. GitHub embeds them as
       images, and an image-rendered SVG is painted at time zero with its
       animations frozen — anything that animates into place stays invisible. */
    
      .lang-name { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
    
  ]]></style>
  <rect x="0" y="0" rx="12" width="350" height="192" fill="#1a1b27"/>
  
  <g transform="translate(25, 30)"><text class="card-title">Most Used Languages</text></g>
  <g transform="translate(25, 50)">
    <g>
      <mask id="langMask"><rect x="0" y="0" width="300" height="8" rx="4" fill="#fff"/></mask>
      <g mask="url(#langMask)">
      <rect x="0.00" y="0" width="137.05" height="8" fill="#e34c26"/>
      <rect x="137.05" y="0" width="76.08" height="8" fill="#DA5B0B"/>
      <rect x="213.13" y="0" width="60.38" height="8" fill="#f1e05a"/>
      <rect x="273.51" y="0" width="11.73" height="8" fill="#4F5D95"/>
      <rect x="285.24" y="0" width="6.77" height="8" fill="#563d7c"/>
      <rect x="292.02" y="0" width="3.96" height="8" fill="#3178c6"/>
      <rect x="295.97" y="0" width="2.93" height="8" fill="#F05138"/>
      <rect x="298.90" y="0" width="0.73" height="8" fill="#41b883"/>
      <rect x="299.63" y="0" width="0.50" height="8" fill="#858585"/>
      </g>
    </g>
    <g transform="translate(0.0, 30)">
        <circle cx="5" cy="0" r="5" fill="#e34c26"/>
        <text class="lang-name" x="16" y="0" dominant-baseline="middle">HTML 45.68%</text>
      </g>
      <g transform="translate(150.0, 30)">
        <circle cx="5" cy="0" r="5" fill="#DA5B0B"/>
        <text class="lang-name" x="16" y="0" dominant-baseline="middle">Jupyter Notebook 25.36%</text>
      </g>
      <g transform="translate(0.0, 50)">
        <circle cx="5" cy="0" r="5" fill="#f1e05a"/>
        <text class="lang-name" x="16" y="0" dominant-baseline="middle">JavaScript 20.13%</text>
      </g>
      <g transform="translate(150.0, 50)">
        <circle cx="5" cy="0" r="5" fill="#4F5D95"/>
        <text class="lang-name" x="16" y="0" dominant-baseline="middle">PHP 3.91%</text>
      </g>
      <g transform="translate(0.0, 70)">
        <circle cx="5" cy="0" r="5" fill="#563d7c"/>
        <text class="lang-name" x="16" y="0" dominant-baseline="middle">CSS 2.26%</text>
      </g>
      <g transform="translate(150.0, 70)">
        <circle cx="5" cy="0" r="5" fill="#3178c6"/>
        <text class="lang-name" x="16" y="0" dominant-baseline="middle">TypeScript 1.32%</text>
      </g>
      <g transform="translate(0.0, 90)">
        <circle cx="5" cy="0" r="5" fill="#F05138"/>
        <text class="lang-name" x="16" y="0" dominant-baseline="middle">Swift 0.98%</text>
      </g>
      <g transform="translate(150.0, 90)">
        <circle cx="5" cy="0" r="5" fill="#41b883"/>
        <text class="lang-name" x="16" y="0" dominant-baseline="middle">Vue 0.24%</text>
      </g>
      <g transform="translate(0.0, 110)">
        <circle cx="5" cy="0" r="5" fill="#858585"/>
        <text class="lang-name" x="16" y="0" dominant-baseline="middle">Other 0.12%</text>
      </g>
  </g>
</svg>
